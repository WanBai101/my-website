        @keyframes dropIn {
            0% {
                opacity: 0;
                transform: translateY(-100%) scale(0.9);
            }
            60% {
                opacity: 1;
                transform: translateY(2%) scale(1.01);
            }
            80% {

            }
            100% {
                opacity: 1;

            }
        }
        .drop-in {
            animation: dropIn 0.8s cubic-bezier(0.2, 0.9, 0.3, 1.2) forwards;
        }
    </style>
