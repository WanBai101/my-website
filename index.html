<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>NexusKey · 虚拟卡密商城</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --bg-deep: #0b0f17;
            --surface-glass: rgba(18, 25, 40, 0.75);
            --surface-solid: #111927;
            --border-glow: rgba(0, 180, 255, 0.25);
            --accent-cyan: #00c8ff;
            --accent-violet: #7c5cff;
            --text-primary: #f0f3fa;
            --text-secondary: #a0b3d9;
            --text-dim: #64748b;
            --success: #2dd4bf;
            --warning: #fbbf24;
            --danger: #f87171;
            --gold: #eab308;
            --radius-xl: 2rem;
            --radius-lg: 1.5rem;
            --radius-md: 1rem;
            --shadow-glow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(0, 200, 255, 0.1);
            --transition-bounce: cubic-bezier(0.2, 0.9, 0.3, 1.2);
        }
        
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(circle at 20% 20%, #1a2436 0%, #0b0f17 90%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    color: var(--text-primary);
    overflow-x: hidden;
}

body::before {
    content: '';
    position: fixed;
    top: -30%;
    left: -20%;
    width: 70vw;
    height: 70vw;
    background: radial-gradient(circle, rgba(0,200,255,0.08) 0%, transparent 70%);
    z-index: 0;
    pointer-events: none;
}

body::after {
    content: '';
    position: fixed;
    bottom: -30%;
    right: -20%;
    width: 70vw;
    height: 70vw;
    background: radial-gradient(circle, rgba(124,92,255,0.1) 0%, transparent 70%);
    z-index: 0;
    pointer-events: none;
}

        .store-container {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 1100px;
    background: var(--surface-glass);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-glow);
    border: 1px solid rgba(255, 255, 255, 0.1);
    overflow: hidden;
    transform-origin: top center;
    animation: none;
}

@keyframes dropIn {
    0% {
        opacity: 0;
        transform: translateY(-100%) scale(0.92);
        border-radius: 3rem;
    }
    60% {
        opacity: 1;
        transform: translateY(2%) scale(1.01);
    }
    80% {
        transform: translateY(-1%) scale(0.99);
    }
    100% {
        opacity: 1;
        transform: translateY(0) scale(1);
        border-radius: var(--radius-xl);
    }
}

.store-container.drop-in {
    animation: dropIn 0.9s var(--transition-bounce) forwards;
}

        .store-header {
    padding: 2rem 2.5rem 1.5rem;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
}

.logo-area {
    display: flex;
    align-items: center;
    gap: 0.75rem;
}

.logo-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(145deg, var(--accent-cyan), var(--accent-violet));
    border-radius: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    box-shadow: 0 10px 25px -5px rgba(0, 200, 255, 0.4);
}

.logo-text {
    font-weight: 700;
    font-size: 1.9rem;
    letter-spacing: -0.02em;
    background: linear-gradient(to right, #ffffff, #cbd5e1);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.badge-live {
    background: rgba(45, 212, 191, 0.15);
    color: var(--success);
    padding: 0.3rem 1rem;
    border-radius: 2rem;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    gap: 6px;
    border: 1px solid rgba(45, 212, 191, 0.3);
}

.badge-live i {
    font-size: 0.7rem;
}

        .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 1.5rem;
    padding: 2rem 2.5rem;
}

.product-card {
    background: rgba(12, 20, 35, 0.7);
    border: 1px solid rgba(255, 255, 255, 0.08);
    border-radius: var(--radius-lg);
    padding: 1.8rem 1.5rem;
    transition: all 0.3s ease;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    backdrop-filter: blur(8px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.3);
}

.product-card:hover {
    transform: translateY(-6px);
    border-color: rgba(0, 200, 255, 0.5);
    box-shadow: 0 20px 30px -10px rgba(0, 200, 255, 0.2);
    background: rgba(18, 30, 50, 0.8);
}

.product-card.selected {
    border: 2px solid var(--accent-cyan);
    background: rgba(0, 200, 255, 0.08);
    box-shadow: 0 0 30px rgba(0, 200, 255, 0.3);
}

.product-name {
    font-weight: 600;
    font-size: 1.3rem;
    margin-bottom: 0.5rem;
    display: flex;
    align-items: center;
    gap: 0.6rem;
}

.product-name i {
    color: var(--accent-cyan);
    font-size: 1.5rem;
}

.product-desc {
    color: var(--text-secondary);
    font-size: 0.85rem;
    margin-bottom: 1.2rem;
    min-height: 2.5rem;
}

.price-tag {
    font-weight: 700;
    font-size: 1.8rem;
    background: linear-gradient(145deg, #ffffff, #a5b4fc);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 1rem;
}

.product-meta {
    display: flex;
    justify-content: space-between;
    color: var(--text-dim);
    font-size: 0.75rem;
    margin-bottom: 1rem;
}

        .btn-primary {
    background: linear-gradient(135deg, var(--accent-cyan), var(--accent-violet));
    border: none;
    color: white;
    font-weight: 600;
    padding: 0.8rem 1.2rem;
    border-radius: 2rem;
    width: 100%;
    cursor: pointer;
    transition: all 0.25s;
    letter-spacing: 0.3px;
    font-size: 0.95rem;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    box-shadow: 0 8px 20px -5px rgba(0, 200, 255, 0.4);
}

.btn-primary:hover {
    transform: scale(1.02);
    box-shadow: 0 12px 25px -5px rgba(0, 200, 255, 0.6);
}

.btn-primary:disabled {
    opacity: 0.6;
    cursor: not-allowed;
    transform: none;
}

.checkout-panel {
    padding: 1.8rem 2.5rem 2.5rem;
    border-top: 1px solid rgba(255,255,255,0.06);
    background: rgba(0, 0, 0, 0.2);
}

.selected-summary {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1.5rem;
}

.summary-left {
    display: flex;
    align-items: center;
    gap: 1rem;
}

.summary-icon {
    width: 50px;
    height: 50px;
    background: rgba(0,200,255,0.15);
    border-radius: 1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    color: var(--accent-cyan);
}

.summary-detail h3 {
    font-weight: 600;
    font-size: 1.2rem;
}

.summary-detail p {
    color: var(--text-secondary);
    font-size: 0.85rem;
}

.summary-price {
    font-weight: 700;
    font-size: 2rem;
    background: linear-gradient(to right, #ffffff, #b6c8ff);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
}

.btn-checkout {
    background: white;
    color: #0b0f17;
    border: none;
    font-weight: 700;
    padding: 1.2rem;
    border-radius: 3rem;
    font-size: 1.2rem;
    cursor: pointer;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    letter-spacing: 0.5px;
    box-shadow: 0 15px 30px -5px rgba(0,0,0,0.5);
}

.btn-checkout:hover {
    background: #f0f4ff;
    transform: translateY(-3px);
    box-shadow: 0 25px 35px -8px rgba(0,200,255,0.5);
}

.btn-checkout:disabled {
    opacity: 0.4;
    pointer-events: none;
}

                .delivery-area {
            background: rgba(0, 200, 255, 0.05);
            border: 1px dashed rgba(0,200,255,0.4);
            border-radius: 1.5rem;
            padding: 1.8rem;
            text-align: center;
            margin-top: 1.5rem;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card-key-display {
            font-family: 'SF Mono', 'Menlo', monospace;
            background: #060b14;
            padding: 1rem;
            border-radius: 1rem;
            border: 1px solid rgba(0,255,200,0.3);
            color: #7ef0d0;
            font-size: 1.1rem;
            letter-spacing: 2px;
            word-break: break-all;
            margin: 0.7rem 0;
            box-shadow: inset 0 0 20px rgba(0,255,200,0.1);
        }

        .notice {
            color: var(--text-dim);
            font-size: 0.85rem;
            margin-top: 0.8rem;
        }

        @media (max-width: 600px) {
            .store-header, .product-grid, .checkout-panel {
                padding-left: 1.2rem;
                padding-right: 1.2rem;
            }
            .summary-price {
                font-size: 1.5rem;
            }
        }
    </style>
</head>

    <body>

<div id="mainStoreContainer" class="store-container">
    <div class="store-header">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-key"></i></div>
            <span class="logo-text">NexusKey</span>
        </div>
        <div class="badge-live">
            <i class="fas fa-circle"></i> 卡密直供 · 自动发货
        </div>
    </div>

    <div class="product-grid" id="productGrid">
        <div class="product-card" data-product-id="prod_1" data-price="59.00" data-name="星辰密钥 · 月卡">
            <div class="product-name">
                <i class="fas fa-star"></i> 星辰密钥
            </div>
            <div class="product-desc">尊享月卡 · 全功能解锁</div>
            <div class="price-tag">¥59</div>
            <div class="product-meta">
                <span><i class="fas fa-database"></i> 库存充足</span>
                <span><i class="fas fa-bolt"></i> 即时到账</span>
            </div>
            <button class="btn-primary select-product" data-id="prod_1">选择此卡</button>
        </div>

            <div class="product-card" data-product-id="prod_2" data-price="149.00" data-name="幻光密钥 · 季卡">
        <div class="product-name">
            <i class="fas fa-gem"></i> 幻光密钥
        </div>
        <div class="product-desc">季卡 · 赠送加速节点</div>
        <div class="price-tag">¥149</div>
        <div class="product-meta">
            <span><i class="fas fa-database"></i> 库存紧张</span>
            <span><i class="fas fa-bolt"></i> 即时到账</span>
        </div>
        <button class="btn-primary select-product" data-id="prod_2">选择此卡</button>
    </div>

    <div class="product-card" data-product-id="prod_3" data-price="399.00" data-name="永恒密钥 · 年卡">
        <div class="product-name">
            <i class="fas fa-crown"></i> 永恒密钥
        </div>
        <div class="product-desc">年卡 · 尊享优先客服</div>
        <div class="price-tag">¥399</div>
        <div class="product-meta">
            <span><i class="fas fa-database"></i> 库存充足</span>
            <span><i class="fas fa-bolt"></i> 即时到账</span>
        </div>
        <button class="btn-primary select-product" data-id="prod_3">选择此卡</button>
    </div>
    </div>

        <div class="checkout-panel" id="checkoutPanel">
        <div class="selected-summary" id="selectedSummary">
            <div class="summary-left">
                <div class="summary-icon"><i class="fas fa-tag"></i></div>
                <div class="summary-detail">
                    <h3 id="selectedProductName">请选择商品</h3>
                    <p id="selectedProductDesc">点击上方任意卡密商品</p>
                </div>
            </div>
            <div class="summary-price" id="selectedPrice">¥ --</div>
        </div>
        <button class="btn-checkout" id="payButton" disabled>
            <i class="fas fa-lock"></i> 立即支付并提取卡密
        </button>
        <div id="deliveryContainer"></div>
        <p class="notice" style="margin-top: 1rem; text-align: center;">
            <i class="fas fa-shield-alt"></i> 支付成功后自动从CloudBase卡密库扣除一张并显示
        </p>
    </div>
</div>

<script>
    (function() {
        const container = document.getElementById('mainStoreContainer');
        container.classList.remove('drop-in');
        void container.offsetWidth;
        container.classList.add('drop-in');

        let selectedProductId = null;
        let selectedPrice = 0;
        let selectedName = '';

        const productCards = document.querySelectorAll('.product-card');
        const payButton = document.getElementById('payButton');
        const selectedProductNameEl = document.getElementById('selectedProductName');
        const selectedProductDescEl = document.getElementById('selectedProductDesc');
        const selectedPriceEl = document.getElementById('selectedPrice');
        const deliveryContainer = document.getElementById('deliveryContainer');

     const productData = {
    prod_1: { name: '星辰密钥 · 月卡', desc: '尊享月卡 · 全功能解锁', price: 59.00 },
    prod_2: { name: '幻光密钥 · 季卡', desc: '季卡 · 赠送加速节点', price: 149.00 },
    prod_3: { name: '永恒密钥 · 年卡', desc: '年卡 · 尊享优先客服', price: 399.00 }
};

function selectProduct(productId) {
    productCards.forEach(card => card.classList.remove('selected'));
    const currentCard = document.querySelector(`.product-card[data-product-id="${productId}"]`);
    if (currentCard) currentCard.classList.add('selected');

    const product = productData[productId];
    if (!product) return;

    selectedProductId = productId;
    selectedPrice = product.price;
    selectedName = product.name;

    selectedProductNameEl.textContent = product.name;
    selectedProductDescEl.textContent = product.desc;
    selectedPriceEl.textContent = `¥ ${product.price.toFixed(2)}`;

    payButton.disabled = false;
    deliveryContainer.innerHTML = '';
}

productCards.forEach(card => {
    card.addEventListener('click', function(e) {
        if (e.target.closest('.select-product')) return;
        const productId = this.dataset.productId;
        selectProduct(productId);
    });

    const selectBtn = card.querySelector('.select-product');
    if (selectBtn) {
        selectBtn.addEventListener('click', function(e) {
            e.stopPropagation();
            const productId = this.dataset.id;
            selectProduct(productId);
        });
    }
});

             async function fetchCardKeyFromCloudBase(productId) {
            await new Promise(resolve => setTimeout(resolve, 800));
            const prefixMap = {
                prod_1: 'XK-MONTH-',
                prod_2: 'XK-SEASON-',
                prod_3: 'XK-YEAR-'
            };
            const prefix = prefixMap[productId] || 'XK-';
            const randomSegment = () => Math.random().toString(36).substring(2, 8).toUpperCase();
            const key = prefix + randomSegment() + '-' + randomSegment() + '-' + randomSegment();
            return key;
        }

        payButton.addEventListener('click', async function() {
            if (!selectedProductId) {
                alert('请先选择商品');
                return;
            }

            payButton.disabled = true;
            payButton.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 正在连接CloudBase...';

            try {
                const cardKey = await fetchCardKeyFromCloudBase(selectedProductId);

                deliveryContainer.innerHTML = `
                    <div class="delivery-area">
                        <div style="font-size: 1.4rem; margin-bottom: 0.5rem;">
                            <i class="fas fa-check-circle" style="color: var(--success);"></i>
                        </div>
                        <h3 style="font-weight: 600; margin-bottom: 0.3rem;">支付成功 · 卡密已发放</h3>
                        <p style="color: var(--text-secondary); margin-bottom: 1rem;">请立即保存您的卡密</p>
                        <div class="card-key-display">${cardKey}</div>
                        <p class="notice"><i class="fas fa-cloud-upload-alt"></i> 已从CloudBase卡密库自动扣除一张</p>
                        <button class="btn-primary" style="margin-top: 1rem; background: var(--surface-solid); border:1px solid rgba(255,255,255,0.2);" onclick="this.parentElement.remove()">我已保存</button>
                    </div>
                `;

                console.log(`[CloudBase] 发货卡密: ${cardKey} 商品ID: ${selectedProductId}`);

                payButton.disabled = false;
                payButton.innerHTML = '<i class="fas fa-lock"></i> 立即支付并提取卡密';
            } catch (error) {
                alert('卡密提取失败，请稍后重试。错误：' + error.message);
                payButton.disabled = false;
                payButton.innerHTML = '<i class="fas fa-lock"></i> 立即支付并提取卡密';
            }
        });

        console.log('✅ 卡密库已连接至 CloudBase (模拟模式)');
    })();
</script>
</body>
</html>
